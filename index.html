<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BulSU Meeting Room Reservation</title>
<style>
:root{--navy:#0b1b3a;--card:#d4ebff;--card2:#bbe0ff;--bg:#f5f5f5;--blue:#66b8ff;--mut:#2c4a7a}
@media(prefers-color-scheme:dark){:root{--bg:#f5f5f5}}
*{box-sizing:border-box}body{margin:0;background:#dfe6ee;font-family:Inter,system-ui,sans-serif;color:var(--navy)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
.login{min-height:100vh;background:linear-gradient(#aad8ff,#4386c8);padding:48px 32px;text-align:center}
.logo{width:74px;height:74px;border:1px solid var(--navy);border-radius:50%;background:#fff;margin:0 auto 14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:34px;line-height:1.05;margin:8px 0}h2{font-size:22px;margin:0 0 10px}
.panel{background:var(--card);border:1.5px solid var(--navy);border-radius:14px;padding:22px;text-align:left;margin-top:22px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select{width:100%;height:46px;border:1px solid var(--navy);border-radius:10px;padding:0 12px;font:inherit;background:#fff;color:var(--navy)}
.btn{width:100%;height:50px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:700 16px inherit;cursor:pointer;margin-top:16px}
.btn.alt{background:#99ccff;color:var(--navy);border:1px solid var(--navy)}.btn.sm{height:38px;font-size:14px;margin:0}.btn.red{background:#b3261e}
.link{background:none;border:0;font:700 15px inherit;color:var(--navy);cursor:pointer;display:block;margin:12px auto 0}
.err{color:#b3261e;font-weight:600;font-size:14px;margin-top:10px;min-height:18px}
.hero{background:#99ccff;border-radius:0 0 32px 32px;padding:34px 24px 46px;position:relative}
.avatar{position:absolute;right:20px;top:24px;width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--navy);display:grid;place-items:center;font-size:24px}
.pad{padding:0 18px}.hdr{padding:24px 18px 4px}
.card{background:var(--card);border:1px solid var(--navy);border-radius:12px;padding:16px;margin:12px 0}
.card{position:relative;z-index:1}.card.up{margin-top:-30px}.card.big{background:var(--card2)}
.tag{display:inline-block;border:1px solid #777;border-radius:8px;padding:2px 10px;font-size:13px;background:#fff;color:#555}
.st-Approved{color:#1e9e3a}.st-Pending{color:#b7791f}.st-Rejected,.st-Cancelled,.st-Released{color:#b3261e}.st-Completed{color:#555}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--navy);border-radius:16px;padding:46px 14px 16px;min-height:170px;cursor:pointer;text-align:left;font:inherit;color:var(--navy)}
.tile b{font-size:20px;display:block}.tile span{font-size:13px;color:var(--mut)}
.tile i{position:absolute;right:-6px;top:-10px;width:60px;height:60px;border-radius:50%;background:var(--blue);border:1px solid var(--navy);display:grid;place-items:center;font-style:normal;font-size:26px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:2px solid var(--navy);display:flex;justify-content:space-around;padding:10px 0 14px}
.nav button{background:none;border:0;font:800 13px inherit;letter-spacing:.06em;color:var(--navy);cursor:pointer;opacity:.55}.nav button.on{opacity:1}.nav span{display:block;font-size:26px}
.steps{display:flex;gap:8px;margin:12px 0}.steps div{flex:1;border-top:3px solid #777;font-size:13px;font-weight:700;color:#777;padding-top:5px}.steps .on{border-color:#0d3b8f;color:var(--navy)}.steps .done{border-color:var(--navy);color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:flex;gap:12px;margin:12px 0}.kv small{display:block;color:var(--mut)}.kv b{font-size:17px}
.code{font-size:24px;font-weight:800;letter-spacing:.03em;border-bottom:1px solid var(--navy);padding-bottom:10px;margin-bottom:6px}
.qr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:150px;margin:10px auto;padding:10px;background:#fff;border:1px solid var(--navy);border-radius:6px}.qr u{aspect-ratio:1;background:var(--navy)}.qr u.l{background:#99ccff}
.sel{outline:3px solid #0d3b8f}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:9;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(11,27,58,.45);display:grid;place-items:center;z-index:20}
.dlg{background:var(--card);border:1.5px solid var(--navy);border-radius:14px;padding:22px;width:min(86vw,340px);text-align:center}
.dlg .btn{margin-top:10px}.spin{width:38px;height:38px;border:4px solid #fff;border-top-color:var(--navy);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{border:1px solid var(--navy);background:#fff;border-radius:20px;height:34px;padding:0 14px;font:700 13px inherit;color:var(--navy);cursor:pointer}
.avatar2{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--navy);font-size:18px;cursor:pointer}
button.avatar{cursor:pointer;font-size:24px;padding:0}
.meter{height:12px;border-radius:6px;background:#fff;border:1px solid var(--navy);overflow:hidden}.meter div{height:100%;background:#e0a020}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let S={view:'login',me:null,token:localStorage.tok||'',form:{},err:'',list:[],rooms:[]};
const api=async(p,o={})=>{const r=await fetch(p,{method:o.body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};
const t12=t=>{let[h,m]=t.split(':');h=+h;return `${h%12||12}:${m} ${h<12?'AM':'PM'}`};
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fs=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dur=(a,b)=>{const m=(b.slice(0,2)-a.slice(0,2))*60+(b.slice(3)-a.slice(3));return(m>=60?Math.floor(m/60)+' hr ':'')+(m%60?m%60+' mins':'')};
const am=a=>a.split(',').filter(Boolean).join(' · ');
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2600)};
const go=async v=>{S.view=v;S.err='';if(['home','history','rooms','admin'].includes(v)||v==='penalties')await refresh();render()};
async function refresh(){try{S.me=await api('/api/me');S.list=await api('/api/reservations');S.rooms=[]}catch(e){logout()}}
function logout(){S.token='';localStorage.tok='';S.me=null;S.view='login';render()}
const hours=[];for(let h=7;h<=20;h++)for(const m of['00','30']){if(h===20&&m==='30')continue;hours.push(String(h).padStart(2,'0')+':'+m)}
const nav=()=>S.me.role==='admin'?'':`<div class="nav">${[['home','⌂','HOME'],['rooms','▯','ROOMS'],['settings','⚙','SETTINGS']].map(([v,i,l])=>`<button class="${S.view===v?'on':''}" onclick="go('${v}')"><span>${i}</span>${l}</button>`).join('')}</div>`;
const head=(t,sub)=>`<div class="hdr"><div class="row" style="margin-bottom:10px"><button class="link" style="margin:0" onclick="go('home')">← Home</button><span class="row" style="gap:8px"><button class="pill" onclick="doLogout()">Log out</button><button class="avatar2" onclick="menu()" aria-label="Account menu">👤</button></span></div><div class="eyebrow">Bulacan State University</div><h1 style="font-size:38px">${t}</h1><b>${sub||S.me.name}</b></div>`;
const rcard=(r,act)=>`<div class="card"><div class="row"><div><b style="font-size:18px">${r.room_name}</b><div class="mut">${r.location} · ${r.building}</div></div><b class="st-${r.status}">${r.status}</b></div><div style="margin-top:8px">${fs(r.date)} | ${t12(r.start_time)} – ${t12(r.end_time)}</div>${S.me.role==='admin'?`<div class="mut">${r.org_name} · ${r.group_size} people</div>`:''}${act||''}</div>`;

function render(){const v=S.view,a=$('#app');
if(v==='login'||v==='register'){const reg=v==='register';a.innerHTML=`<div class="login"><div class="logo"></div><div class="eyebrow">Bulacan State University</div><h1>Meeting Room Reservation</h1><p>${reg?'Create an account for your organization':'Log in with your organization email to find available rooms'}</p><div class="panel"><h2>${reg?'Create account':'Log in'}</h2>
${reg?`<label>Organization name</label><input id="n" placeholder="CPE Organization"><label>Representative name</label><input id="rn" placeholder="Full name">`:''}
<label>Organization email</label><input id="e" type="email" placeholder="you@org.edu" value="${reg?'':'cpe@bulsu.edu.ph'}"><label>Password</label><input id="p" type="password" placeholder="Enter your password" value="${reg?'':'cpe12345'}">
<div class="err">${S.err}</div><button class="btn" style="margin-top:4px" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Create account':'Log in'}</button><p style="text-align:center;margin:14px 0 0">${reg?'Have an account?':'New here?'}</p><button class="link" style="margin-top:2px" onclick="S.err='';S.view='${reg?'login':'register'}';render()">${reg?'Log in':'Create account'}</button></div><div class="mut" style="margin-top:14px;color:#0b1b3a">Admin demo: admin@bulsu.edu.ph / admin123</div></div>`;return}
if(v==='home'){const nx=S.list.filter(r=>r.status==='Approved').sort((x,y)=>(x.date+x.start_time).localeCompare(y.date+y.start_time))[0];
a.innerHTML=`<div class="hero"><div class="eyebrow" style="font-size:15px">GOOD DAY!</div><h1 style="margin:4px 0;font-size:38px">${S.me.name}</h1><b style="font-weight:500">Bulacan State University</b><button class="avatar" onclick="menu()" aria-label="Account menu">👤</button><button class="pill" style="position:absolute;right:20px;bottom:42px" onclick="doLogout()">Log out</button></div><div class="pad">
${S.me.is_suspended?`<div class="card" style="background:#fde0dd;margin-top:-30px"><b>Account suspended</b><div class="mut">You reached ${S.me.max_penalty} penalties. Contact the administrator.</div></div>`:''}
${nx?`<div class="card ${S.me.is_suspended?'':'up'}"><div class="row"><b>Your Reservation</b><span class="st-Approved">${nx.is_checked_in?'Checked in':'Reserved'}</span></div><h2 style="font-size:30px;margin:6px 0">${nx.room_name}</h2><div>${fs(nx.date)} | ${t12(nx.start_time)} - ${t12(nx.end_time)}</div><div class="mut">${nx.location} - ${nx.building}</div><button class="link" style="text-align:right;margin:8px 0 0 auto" onclick="S.sel=${nx.reservation_id};go('detail')">View Details</button></div>`:`<div class="card up"><b>No upcoming reservation</b><div class="mut">Reserve a room to get your check-in code.</div></div>`}
<h2 style="margin:26px 0 6px 6px">Quick actions</h2><div class="grid">${[['book','＋','Reserve a Room','Book a time slot'],['history','▭','Reservation History',"See your organization's booking history"],['penalties','⚠','Penalties',`${S.me.penalty_count} of ${S.me.max_penalty} penalties`],['about','🔍','About Us','Read about the reservation system']].map(x=>`<button class="tile" onclick="${x[0]==='book'?'startBook()':`go('${x[0]}')`}"><i>${x[1]}</i><b>${x[2]}</b><span>${x[3]}</span></button>`).join('')}</div></div>`+nav();return}
if(v==='book'||v==='review'||v==='confirm'){const f=S.form,st=v==='book'?0:v==='review'?1:2;
const steps=`<div class="steps">${['Booking','Review','Confirmation'].map((x,i)=>`<div class="${i===st?'on':i<st?'done':''}">${x}</div>`).join('')}</div>`;
let body='';
if(v==='book'){const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return iso(d)});
body=`<div class="card big" style="padding:18px"><label style="margin-top:0">Date</label><select id="d">${days.map(d=>`<option value="${d}" ${d===f.date?'selected':''}>${fd(d)}</option>`).join('')}</select><div class="two"><div><label>Start time</label><select id="s">${hours.slice(0,-1).map(h=>`<option value="${h}" ${h===f.start?'selected':''}>${t12(h)}</option>`).join('')}</select></div><div><label>End time</label><select id="en">${hours.slice(1).map(h=>`<option value="${h}" ${h===f.end?'selected':''}>${t12(h)}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px"><b>Group size</b><input id="g" type="number" min="1" max="50" value="${f.size}" style="width:50%;text-align:center"></div><button class="btn" onclick="findRooms()">Find available rooms</button></div>
<div class="err">${S.err}</div>${S.rooms.length||f.searched?`<div class="row" style="margin:16px 4px 4px"><h2 style="margin:0">${S.rooms.length} room${S.rooms.length===1?'':'s'} available</h2><span class="mut">For ${dur(f.start,f.end)}</span></div>`:''}
${S.rooms.map(r=>`<div class="card ${f.room&&f.room.room_id===r.room_id?'sel':''}" style="cursor:pointer" onclick="pick(${r.room_id})"><div class="row"><b style="font-size:19px">${r.room_name}</b><span class="tag">Available</span></div><div class="mut" style="margin:6px 0">${r.location} · ${r.building}</div><div class="mut">■ ${r.capacity} seats · ${am(r.amenities)}</div></div>`).join('')}
<button class="btn" onclick="toReview()">Review the details</button><button class="link" onclick="go('home')">Back</button>`}
if(v==='review'){const r=f.room;body=`<div class="card big" style="padding:18px"><h2 style="font-size:26px">${r.room_name}</h2><div class="mut">${r.location} · ${r.building}</div><div class="mut" style="margin:6px 0 12px">${r.capacity} seats · ${am(r.amenities)}</div><hr>${[['📅','Date',fd(f.date)],['🕑','Time',t12(f.start)+' - '+t12(f.end)],['👥','Group size',f.size+' people'],['🏛','Organization',S.me.name]].map(x=>`<div class="kv"><span>${x[0]}</span><div><small>${x[1]}</small><b>${x[2]}</b></div></div>`).join('')}</div><b>Before you confirm</b><p class="mut" style="color:#0d3b8f">This room will be reserved for your organization. You can cancel from Reservation History if your plans change. Check in within ${S.me.grace} minutes of the start time or the booking is released and a penalty is recorded.</p><div class="err">${S.err}</div><button class="btn" onclick="confirmRes()">Confirm reservation</button><button class="link" onclick="S.view='book';render()">Change room or details</button>`}
if(v==='confirm'){const r=f.done;const q=[...Array(49)].map((_,i)=>`<u class="${(i*7+i%5)%3?'':'l'}"></u>`).join('');body=`<div class="row" style="justify-content:flex-start;gap:14px;margin:6px 0"><span style="font-size:34px">✅</span><div><b>Reservation confirmed</b><div class="mut">${r.room_name} is ready for your group.</div></div></div><div class="card big" style="padding:18px"><small>Check-In Code</small><div class="code">${r.check_in_code}</div>${[['Room',r.room_name,r.location+' · '+r.building],['Date & time',fd(r.date),t12(r.start_time)+' – '+t12(r.end_time)],['Organization & group',S.me.name,r.group_size+' people · '+dur(r.start_time,r.end_time)]].map(x=>`<div class="kv"><div><small>${x[0]}</small><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}<hr><div class="mut" style="text-align:center">Booking QR code (placeholder — not scannable)</div><div class="qr">${q}</div></div><p class="mut" style="color:#0d3b8f">Keep your booking reference handy. Please leave the room ready for the next group.</p><button class="btn" onclick="startBook()">Book another room</button><button class="btn alt" onclick="go('home')">Return to Home</button>`}
a.innerHTML=head(v==='confirm'?'You are booked!':'Reserve a room')+`<div class="pad">${steps}${body}</div>`;return}
if(v==='history'){a.innerHTML=head('Reservation History')+`<div class="pad">${S.list.map(r=>rcard(r,`<button class="link" style="text-align:right;margin:6px 0 0 auto" onclick="S.sel=${r.reservation_id};go('detail')">View Details</button>`)).join('')||'<p class="mut">No reservations yet.</p>'}</div>`+nav();return}
if(v==='detail'){const r=S.list.find(x=>x.reservation_id===S.sel);const open=r.status==='Approved'&&!r.is_checked_in;
a.innerHTML=head('Reservation')+`<div class="pad"><div class="card big" style="padding:18px"><div class="row"><b style="font-size:22px">${r.room_name}</b><b class="st-${r.status}">${r.is_checked_in&&r.status==='Approved'?'Checked in':r.status}</b></div><div class="mut">${r.location} · ${r.building}</div><div class="kv"><div><small>Date & time</small><b>${fd(r.date)}</b><div>${t12(r.start_time)} – ${t12(r.end_time)}</div></div></div><div class="kv"><div><small>Group</small><b>${r.group_size} people</b></div></div>${r.check_in_code&&r.status==='Approved'?`<small>Check-In Code</small><div class="code">${r.check_in_code}</div>`:''}</div>
${open?`<label>Check in</label><input id="cc" placeholder="Enter check-in code"><div class="err">${S.err}</div><button class="btn" style="margin-top:0" onclick="checkin(${r.reservation_id})">Check in</button>`:''}${['Pending','Approved'].includes(r.status)?`<button class="btn red" onclick="cancelRes(${r.reservation_id})">Cancel reservation</button>`:''}<button class="link" onclick="go('history')">Back</button></div>`+nav();return}
if(v==='penalties'){const m=S.me;a.innerHTML=head('Penalties')+`<div class="pad"><div class="card big"><h2 style="font-size:40px;margin:0">${m.penalty_count} / ${m.max_penalty}</h2><div class="meter" style="margin:10px 0"><div style="width:${m.penalty_count/m.max_penalty*100}%"></div></div><div class="mut">A penalty is added when a reservation isn't checked in within ${m.grace} minutes of its start. At ${m.max_penalty} penalties, booking is suspended until an administrator resets it.</div></div><h2 style="margin-top:22px">Released bookings</h2>${S.list.filter(r=>r.status==='Released').map(r=>rcard(r)).join('')||'<p class="mut">None. Keep it up!</p>'}</div>`+nav();return}
if(v==='about'){a.innerHTML=head('About Us','Meeting Room Reservation System')+`<div class="pad"><div class="card"><p>Student organizations used to book rooms on a physical calendar that could be erased, overwritten or faked. This system replaces it with a central booking record: every reservation has an owner, a room and a time slot, overlapping bookings are blocked, and rooms nobody shows up for are released automatically after ${S.me.grace} minutes.</p></div><button class="link" onclick="go('home')">Back</button></div>`+nav();return}
if(v==='rooms'){(async()=>{const d=iso(new Date());const all=await api(`/api/rooms/available?date=${d}&start=${new Date().getHours()<20?String(Math.max(7,new Date().getHours()+1)).padStart(2,'0')+':00':'19:00'}&end=20:00&size=1`).catch(()=>[]);a.innerHTML=head('Rooms','Free for the rest of today')+`<div class="pad">${all.map(r=>`<div class="card"><div class="row"><b style="font-size:19px">${r.room_name}</b><span class="tag">Available</span></div><div class="mut" style="margin:6px 0">${r.location} · ${r.building}</div><div class="mut">■ ${r.capacity} seats · ${am(r.amenities)}</div></div>`).join('')||'<p class="mut">No rooms free for the rest of today.</p>'}<button class="btn" onclick="startBook()">Reserve a Room</button></div>`+nav()})();return}
if(v==='settings'){a.innerHTML=head('Settings')+`<div class="pad"><div class="card"><b>${S.me.name}</b><div class="mut">${S.me.rep_name} · ${S.me.email}</div></div><button class="btn" onclick="logout()">Log out</button></div>`+nav();return}
if(v==='admin'){(async()=>{const orgs=await api('/api/admin/orgs');const pend=S.list.filter(r=>r.status==='Pending'),act=S.list.filter(r=>r.status==='Approved'),rest=S.list.filter(r=>!['Pending','Approved'].includes(r.status));
const btns=r=>`<div class="two" style="margin-top:10px">${r.status==='Pending'?`<button class="btn sm" onclick="adm(${r.reservation_id},'approve')">Approve</button><button class="btn sm red" onclick="adm(${r.reservation_id},'reject')">Reject</button>`:`<span class="mut">${r.is_checked_in?'✔ Checked in':'Awaiting check-in · '+r.check_in_code}</span><button class="btn sm red" onclick="adm(${r.reservation_id},'cancel')">Cancel</button>`}</div>`;
a.innerHTML=`<div class="hero"><div class="eyebrow">Administrator</div><h1 style="font-size:32px">Reservation Control</h1><button class="pill" onclick="doLogout()">Log out</button></div><div class="pad"><h2 style="margin-top:20px">Pending (${pend.length})</h2>${pend.map(r=>rcard(r,btns(r))).join('')||'<p class="mut">Nothing waiting.</p>'}<h2>Live bookings (${act.length})</h2>${act.map(r=>rcard(r,btns(r))).join('')||'<p class="mut">None.</p>'}<h2>Organizations & penalties</h2>${orgs.map(o=>`<div class="card"><div class="row"><div><b>${o.name}</b><div class="mut">${o.penalty_count} penalties ${o.is_suspended?'· SUSPENDED':''}</div></div>${o.penalty_count?`<button class="btn sm" style="width:auto;padding:0 14px" onclick="resetOrg(${o.org_id})">Reset</button>`:''}</div></div>`).join('')}<h2>History</h2>${rest.map(r=>rcard(r)).join('')||'<p class="mut">None.</p>'}</div>`})();return}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function overlay(h){let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';o.className='ov';document.body.append(o)}o.innerHTML=`<div class="dlg" role="dialog">${h}</div>`}
function closeOv(){const o=$('#ov');if(o)o.remove()}
const lock=x=>document.querySelectorAll('.btn').forEach(b=>b.disabled=x);
async function busy(msg,fn){overlay(`<div class="spin"></div><b>${msg}</b><div class="mut">Please wait a moment…</div>`);lock(true);try{return(await Promise.all([fn(),wait(600)]))[0]}finally{closeOv();lock(false)}}
function ask(title,text,ok,danger){return new Promise(res=>{overlay(`<h2>${title}</h2><p class="mut">${text}</p><div class="two"><button class="btn alt" id="no">Keep it</button><button class="btn ${danger?'red':''}" id="yes">${ok}</button></div>`);$('#no').onclick=()=>{closeOv();res(false)};$('#yes').onclick=()=>{closeOv();res(true)}})}
function menu(){overlay(`<div class="avatar2" style="margin:0 auto 10px;width:56px;height:56px;font-size:26px;display:grid;place-items:center">👤</div><b>${S.me.name}</b><div class="mut">${S.me.email}</div><button class="btn alt" onclick="closeOv();go(S.me.role==='admin'?'admin':'home')">Back to Home</button><button class="btn" onclick="closeOv();doLogout()">Log out</button><button class="link" onclick="closeOv()">Close</button>`)}
function doLogout(){logout();toast('You have been logged out')}
async function doLogin(){try{const em=$('#e').value,pw=$('#p').value;const d=await busy('Logging you in…',()=>api('/api/login',{body:{email:em,password:pw}}));S.token=d.token;localStorage.tok=d.token;await refresh();go(d.role==='admin'?'admin':'home')}catch(e){S.err=e.message;render()}}
async function doReg(){try{const b={name:$('#n').value,rep_name:$('#rn').value,email:$('#e').value,password:$('#p').value};await busy('Creating your account…',()=>api('/api/register',{body:b}));S.view='login';S.err='';render();toast('Account created. Please log in.')}catch(e){S.err=e.message;render()}}
function startBook(){const d=new Date();let h=Math.min(18,Math.max(7,d.getHours()+1));S.form={date:iso(d),start:String(h).padStart(2,'0')+':00',end:String(h+1).padStart(2,'0')+':30',size:8};S.rooms=[];S.err='';S.view='book';render()}
function readForm(){const f=S.form;f.date=$('#d').value;f.start=$('#s').value;f.end=$('#en').value;f.size=+$('#g').value||1}
async function findRooms(){readForm();S.form.room=null;try{const q=S.form;S.rooms=await busy('Finding available rooms…',()=>api(`/api/rooms/available?date=${q.date}&start=${q.start}&end=${q.end}&size=${q.size}`));S.err='';S.form.searched=1}catch(e){S.rooms=[];S.err=e.message}render()}
function pick(id){readForm();S.form.room=S.rooms.find(r=>r.room_id===id);render()}
function toReview(){readForm();if(!S.form.room){S.err='Please find and select a room first.';return render()}S.err='';S.view='review';render()}
async function confirmRes(){const f=S.form;try{f.done=await busy('Confirming your reservation…',()=>api('/api/reservations',{body:{room_id:f.room.room_id,date:f.date,start:f.start,end:f.end,group_size:f.size}}));S.view='confirm';S.err='';render()}catch(e){S.err=e.message;render()}}
async function checkin(id){try{const code=$('#cc').value;await busy('Checking you in…',()=>api(`/api/reservations/${id}/checkin`,{body:{code}}));toast('Checked in!');await go('detail')}catch(e){S.err=e.message;render()}}
async function cancelRes(id){if(!await ask('Cancel this reservation?','Your organization will give up this time slot and others will be able to book it.','Cancel reservation',true))return;try{await busy('Cancelling your reservation…',()=>api(`/api/reservations/${id}/cancel`,{body:{}}));toast('Reservation cancelled');go('history')}catch(e){toast(e.message)}}
async function adm(id,a){try{await busy('Updating reservation…',async()=>{await api(`/api/reservations/${id}/${a}`,{body:{}});await refresh()});render()}catch(e){toast(e.message)}}
async function resetOrg(id){await api(`/api/admin/orgs/${id}/reset`,{body:{}});render()}
if(S.token){refresh().then(()=>go(S.me.role==='admin'?'admin':'home'))}else render();
</script></body></html>
